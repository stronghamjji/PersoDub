# Builds the Windows installer and keeps it as a downloadable artifact.
#
# Separate from ci.yml on purpose: ci.yml is the fast check that runs on every
# push, this one is the slow packaging job that only runs when asked. It also
# exists because the installer cannot be built on a locked-down workstation --
# electron-builder unpacks a signing toolset that contains symlinks, and
# creating those needs a privilege a standard Windows account does not have. A
# hosted runner has it.
#
# The build is unsigned, so the installer it produces raises a SmartScreen
# warning. That is expected until a certificate exists.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build
        required: false
        default: opensource
        type: choice
        options: [opensource, production]
  push:
    branches: [feature/windows-support]

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Not in the repository (27 MB binary), so the packager fetches its own
      # copy from the same pinned URL and checksum the installer uses at run
      # time -- see CAMPPLUS_URL / CAMPPLUS_SHA256 in desktop/src/installSpec.js.
      - name: Fetch the CAM++ speaker model
        shell: bash
        env:
          URL: https://huggingface.co/welcomyou/campplus-3dspeaker-200k-onnx/resolve/main/campplus_cn_en_common_200k.onnx
          SHA256: dd1740aa1e1ffa3895f96aef2166b8af2bb2ad09c00769dd275ee36aef6a2a7f
        run: |
          curl -sSfL "$URL" -o campplus.onnx
          echo "${SHA256}  campplus.onnx" | sha256sum -c -

      - run: npm ci
        working-directory: desktop

      - name: Build the installer
        working-directory: desktop
        env:
          CAMPPLUS_SRC: ${{ github.workspace }}\campplus.onnx
          CSC_IDENTITY_AUTO_DISCOVERY: "false"  # no certificate: do not go looking for one
          # Open source unless a hand-started run picks production
          # (desktop/src/edition.js); a release build is the open-source one.
          PERSODUB_EDITION: ${{ github.event.inputs.edition || 'opensource' }}
          # The production build's support web app (desktop/src/edition.js
          # BUILD_KEYS), from the repository's secret; nothing for open source.
          PERSODUB_INQUIRY_URL: ${{ github.event.inputs.edition == 'production' && secrets.PERSODUB_INQUIRY_URL || '' }}
        # The production build is PersoDubbing on screen (desktop/src/edition.js displayName).
        run: npm run ${{ github.event.inputs.edition == 'production' && 'dist:win:prod' || 'dist:win' }}

      - uses: actions/upload-artifact@v4
        with:
          name: PersoDub-Setup-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
          # This installer is here to be downloaded and tested within the hour,
          # not kept: at 138MB each, the default 90 days filled the account's
          # 0.5GB of included Actions storage twice over (2026-09-18). A release
          # keeps its own copy, and release storage is not this budget.
          retention-days: 2
          if-no-files-found: error
