<!doctype html><meta charset="utf-8"><title data-i18n>{app}: Startup failed</title>
<style>
  /* On Windows and the Mac the shell hides the system title bar
     (src/windowFactory.js), so a strip along the top edge is what this screen
     is moved by. The Mac's lights sit in its left end, 12px in, well clear of
     the mark 60px down in the centred column (2026-10-21). */
  .drag { position: fixed; top: 0; left: 0; right: 0; height: 36px; -webkit-app-region: drag; }
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 0 auto; word-break: keep-all;
         padding: 80px 20px; background: #0e131b; color: #eaf0fd; }
  pre { background: #1c2129; color: #9ea5b0; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  /* Where an install stopped, and the note under a sentence: the smaller grey
     lines, as on the install screen. The note keeps its line breaks (a list
     of addresses goes on a line of its own). */
  .sub { color: #9ea5b0; font-size: 13px; white-space: pre-line; }
  /* The sentence itself reads as text, not as a tool's output; a preflight's
     own line breaks ("Needs: … / Free: …") still show. */
  #message { white-space: pre-wrap; line-height: 1.5; }
  summary { color: #9ea5b0; font-size: 13px; cursor: pointer; }
  button { font-size: 15px; padding: 8px 20px; border-radius: 6px; border: 1px solid #166CFB;
           background: #166CFB; color: #ffffff; cursor: pointer; }
  /* The mark and the name side by side, ranged left over the column they head --
     the shape Premiere, Resolve and Docker Desktop use on a screen that has to
     say what it is doing while it loads. The version rides along so nobody has
     to be asked which one they are running. */
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 26px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: .01em; color: #eaf0fd; }
  .brand .ver { color: #9ea5b0; font-size: 12px; }
</style>
<div class="drag"></div>
<div class="brand"><img src="logo.png" alt=""><b data-i18n>{app}</b><span class="ver" id="ver"></span></div>
<h2 id="title" data-i18n>{app} could not start</h2>
<p id="where" class="sub"></p>
<p id="message"></p>
<p id="note" class="sub"></p>
<details id="more"><summary data-i18n>Details</summary><pre id="raw"></pre></details>
<p id="logs"><span data-i18n>Log folder:</span> <code id="logDir"></code></p>
<button data-i18n onclick="window.persodubShell.retry()">Try again</button>
<script>
  const q = new URLSearchParams(location.search);
  // Each failure names itself. One fixed heading meant a preflight that
  // stopped before anything started still announced that the engines had
  // failed to start, which contradicted the sentence right below it. The
  // markup's own heading is the fallback, in the user's language
  // (desktop/src/screenText.js).
  const title = document.getElementById("title");
  if (q.get("title")) title.textContent = q.get("title");
  const heading = title.textContent;
  document.title = `${q.get("name") || "PersoDub"}: ${heading}`;  // the window title, which said
                                            // "Startup failed" either way
  // Each line only when there is something to say: where an install stopped,
  // the sentence saying why and what to press, a note under it, and the
  // tool's own words folded under Details -- an empty box read as missing.
  for (const id of ["where", "message", "note"]) {
    const el = document.getElementById(id);
    if (q.get(id)) el.textContent = q.get(id);
    else el.remove();
  }
  if (q.get("details")) document.getElementById("raw").textContent = q.get("details");
  else document.getElementById("more").remove();
  // A preflight has no log to point at -- it stopped before a byte was written.
  // An empty path under "Log folder:" reads like something went missing.
  const dir = q.get("logDir");
  if (dir) document.getElementById("logDir").textContent = dir;
  else document.getElementById("logs").remove();
</script>
<script>
  // The version comes in on the query string (desktop/src/bootFlow.js), so every launch
  // screen names the build the user is on without asking anyone.
  const v = new URLSearchParams(location.search).get("v");
  if (v) document.getElementById("ver").textContent = "v" + v;
</script>
