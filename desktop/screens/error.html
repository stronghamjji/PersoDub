<!doctype html><meta charset="utf-8"><title>PersoDub: Startup failed</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 0 auto;
         padding: 80px 20px; background: #1e1e22; color: #ececf1; }
  pre { background: #26262b; color: #9a9aa6; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
  button { font-size: 15px; padding: 8px 20px; border-radius: 6px; border: 1px solid #166CFB;
           background: #166CFB; color: #ffffff; cursor: pointer; }
  /* The mark and the name side by side, ranged left over the column they head --
     the shape Premiere, Resolve and Docker Desktop use on a screen that has to
     say what it is doing while it loads. The version rides along so nobody has
     to be asked which one they are running. */
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 26px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: .01em; color: #ececf1; }
  .brand .ver { color: #9a9aa6; font-size: 12px; }
</style>
<div class="brand"><img src="logo.png" alt=""><b>PersoDub</b><span class="ver" id="ver"></span></div>
<h2 id="title"></h2>
<pre id="message"></pre>
<p id="logs">Logs: <code id="logDir"></code></p>
<button onclick="window.persodubShell.retry()">Try again</button>
<script>
  const q = new URLSearchParams(location.search);
  // Each failure names itself. One fixed heading meant a preflight that
  // stopped before anything started still announced that the engines had
  // failed to start, which contradicted the sentence right below it.
  const heading = q.get("title") || "The engines failed to start";
  document.getElementById("title").textContent = heading;
  document.title = `PersoDub: ${heading}`;  // the window title, which said
                                            // "Startup failed" either way
  document.getElementById("message").textContent = q.get("message") || "(no details)";
  // A preflight has no log to point at -- it stopped before a byte was written.
  // An empty path under "Logs:" reads like something went missing.
  const dir = q.get("logDir");
  if (dir) document.getElementById("logDir").textContent = dir;
  else document.getElementById("logs").remove();
</script>
<script>
  // The version comes in on the query string (desktop/main.js), so every launch
  // screen names the build the user is on without asking anyone.
  const v = new URLSearchParams(location.search).get("v");
  if (v) document.getElementById("ver").textContent = "v" + v;
</script>
