<!doctype html><meta charset="utf-8"><title data-i18n>PersoDub: Installing</title>
<style>
  /* On Windows and the Mac the shell hides the system title bar
     (src/windowFactory.js), so a strip along the top edge is what this screen
     is moved by. The Mac's lights sit in its left end, 12px in, well clear of
     the mark 60px down in the centred column (2026-10-21). */
  .drag { position: fixed; top: 0; left: 0; right: 0; height: 36px; -webkit-app-region: drag; }
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 0 auto; word-break: keep-all;
         padding: 60px 20px; background: #0e131b; color: #eaf0fd; }
  li { margin: 6px 0; color: #9ea5b0; }
  li.active { color: #eaf0fd; font-weight: 600; }
  li.done { color: #3fbf5f; }
  li.done::after { content: " ✓"; }
  #bar { width: 100%; height: 8px; background: #232831; border-radius: 4px; overflow: hidden; margin: 18px 0 6px; }
  #fill { height: 100%; width: 0%; background: #166CFB; transition: width .3s; }
  #detail { color: #9ea5b0; font-size: 13px; min-height: 1.2em; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  /* The mark and the name side by side, ranged left over the column they head --
     the shape Premiere, Resolve and Docker Desktop use on a screen that has to
     say what it is doing while it loads. The version rides along so nobody has
     to be asked which one they are running. */
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 26px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: .01em; color: #eaf0fd; }
  .brand .ver { color: #9ea5b0; font-size: 12px; }
</style>
<div class="drag"></div>
<div class="brand"><img src="logo.png" alt=""><b>PersoDub</b><span class="ver" id="ver"></span></div>
<h2 id="title"></h2>
<ol id="steps"></ol>
<div id="bar"><div id="fill"></div></div>
<div id="detail"></div>
<!-- The script's own words, here so the shell can put them in the user's
     language (desktop/src/screenText.js). -->
<div hidden>
  <span id="updating" data-i18n>Updating PersoDub</span>
  <span id="settingUp" data-i18n>Setting up PersoDub</span>
  <span id="toDownload" data-i18n>{size} to download</span>
  <span id="ofTotal" data-i18n>{done} of {total}</span>
  <span id="retrying" data-i18n>Connection problem, retrying ({n}/{m})</span>
  <span id="failed" data-i18n>failed</span>
</div>
<script>
  // mode=update (same kit already installed) vs install (first time), and the
  // total bytes the still-missing steps add up to -- both handed in by bootFlow.js
  // via the query string, since only it knows which kit this is and what
  // bytesStillNeeded came out to.
  const q = new URLSearchParams(location.search);
  const say = (id) => document.getElementById(id).textContent;
  const gb = (b) => (b / 1024 ** 3).toFixed(1) + " GB";
  const title = document.getElementById("title");
  // The figure bootFlow.js sends is a floor: it is measured before the payload
  // step replaces the requirements files, which is what re-opens the venv
  // steps -- so steps it could not know about still arrive. Grow it as they
  // do, rather than showing "2.3 GB of 0.3 GB".
  let total = Number(q.get("bytes")) || 0;
  const counted = new Set();
  const setTitle = () => {
    title.textContent = say(q.get("mode") === "update" ? "updating" : "settingUp")
      + (total ? " · " + say("toDownload").replace("{size}", gb(total)) : "");
  };
  setTitle();

  // The step list is built from the progress events themselves (each carries
  // its step's title, in order) -- a hard-coded copy of installSpec.js's
  // titles drifted every time a step changed, down to a stale "mac-env" id.
  const ol = document.getElementById("steps");
  const items = {};
  const fill = document.getElementById("fill");
  const detail = document.getElementById("detail");
  // Bytes received so far, from steps that actually ran (not skipped -- a
  // skipped step was already there before this run and never counted toward
  // `total`, which comes from bytesStillNeeded's not-yet-done steps only).
  let received = 0;
  window.persodubShell.onInstallProgress((p) => {
    // A skipped step was already there before this run started -- showing it
    // would make the list flash through steps the user never actually waited
    // on, which is what made an update look like a fresh install.
    if (p.state === "skipped") return;
    if (!counted.has(p.stepId)) { counted.add(p.stepId); total = Math.max(total, received + (p.bytes || 0)); setTitle(); }
    if (!items[p.stepId]) {
      const el = document.createElement("li");
      el.textContent = p.title || p.stepId;
      ol.appendChild(el);
      items[p.stepId] = el;
    }
    const li = items[p.stepId];
    if (p.state === "start") li.className = "active";
    if (p.state === "done") {
      li.className = "done";
      fill.style.width = "0%";
      received += p.bytes || 0;
    }
    if (p.state === "progress") {
      li.className = "active";
      if (p.pct != null) fill.style.width = p.pct + "%";
      // Only the figures, or a retry in the user's language: the tool's own
      // lines ("Collecting torch==2.5.1") are for shell.log, not this screen.
      // installer.js sends the retry in English; the page's models dialog
      // reads it by the same words (ui/src/modelsDialog.mjs retryLine).
      const retry = /^Connection problem, retrying \((\d+)\/(\d+)\)/.exec(p.detail || "");
      detail.textContent = retry
        ? say("retrying").replace("{n}", retry[1]).replace("{m}", retry[2])
        : total
          ? say("ofTotal").replace("{done}", gb(received + (p.pct || 0) / 100 * (p.bytes || 0))).replace("{total}", gb(total))
          : "";
    }
    if (p.state === "error") { li.className = "active"; detail.textContent = p.detail || say("failed"); }
  });
</script>
<script>
  // The version comes in on the query string (desktop/src/bootFlow.js), so every launch
  // screen names the build the user is on without asking anyone.
  const v = new URLSearchParams(location.search).get("v");
  if (v) document.getElementById("ver").textContent = "v" + v;
</script>
