<!doctype html><meta charset="utf-8"><title>PersoDub</title>
<style>
  /* The same shape as installing.html and not-installed.html: the mark and the
     name centred at the top, everything the screen has to say ranged left in a
     560px column under it. The three screens are the same screen at different
     moments, so they cannot be laid out three ways. */
  body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 0 auto;
         padding: 60px 20px; background: #1e1e22; color: #ececf1; }
  /* h2 keeps the browser's own size, the way the other two screens do. */
  p { color: #9a9aa6; font-size: 14px; margin: 4px 0 0; }
  /* Nothing here knows how far along it is, so the bar sweeps rather than
     fills -- the same 8px bar the install screen shows, in the same place. */
  #bar { width: 100%; height: 8px; background: #2c2c32; border-radius: 4px;
         overflow: hidden; margin: 18px 0 6px; }
  #bar i { display: block; height: 100%; width: 32%; border-radius: 4px;
           background: #166CFB; animation: sweep 1.5s ease-in-out infinite; }
  @keyframes sweep { 0% { margin-left: -32%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { #bar i { animation: none; width: 100%; opacity: .5; } }
  /* The mark and the name side by side, ranged left over the column they head --
     the shape Premiere, Resolve and Docker Desktop use on a screen that has to
     say what it is doing while it loads. The version rides along so nobody has
     to be asked which one they are running. */
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 26px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; display: block; }
  .brand b { font-size: 14px; font-weight: 600; letter-spacing: .01em; color: #ececf1; }
  .brand .ver { color: #9a9aa6; font-size: 12px; }
</style>
<div class="brand"><img src="logo.png" alt=""><b>PersoDub</b><span class="ver" id="ver"></span></div>
<h2>Starting engines…</h2>
<div id="bar"><i></i></div>
<p>First launch can take a minute or two while the voice model loads.</p>

<script>
  // The version comes in on the query string (desktop/main.js), so every launch
  // screen names the build the user is on without asking anyone.
  const v = new URLSearchParams(location.search).get("v");
  if (v) document.getElementById("ver").textContent = "v" + v;
</script>
